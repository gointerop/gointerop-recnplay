server:
  port: 8090

spring:
  application:
    name: fhir-facade
  datasource:
    # Replica somente leitura do SIGH. O usuario tem apenas SELECT no schema sigh.
    url: ${SIGH_URL:jdbc:postgresql://localhost:55432/sigh}
    username: ${SIGH_USER:integracao_ro}
    password: ${SIGH_PASSWORD:integracao_ro}
    hikari:
      # Sem escrita: a conexao e marcada como somente leitura tambem no pool, para que
      # qualquer tentativa acidental falhe no driver antes de chegar ao banco.
      read-only: true
      maximum-pool-size: 10
      pool-name: sigh-ro

logging:
  level:
    root: INFO
    br.com.gointerop.fhir: INFO
    # O HAPI registra a URL completa de cada requisicao em DEBUG. Como a URL pode
    # carregar parametro de busca com documento, o nivel fica em WARN.
    ca.uhn.fhir.rest.server.interceptor: WARN
